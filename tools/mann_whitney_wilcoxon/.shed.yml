name: mann_whitney_wilcoxon
owner: goeckslab
description: Mann-Whitney U and Wilcoxon signed-rank tests for tabular data
long_description: |
  Run non-parametric two-sample statistical tests from Galaxy tabular datasets.
  The wrapper supports independent two-sample Mann-Whitney U tests and paired
  Wilcoxon signed-rank tests.
