name: gseapy_enrichr
owner: goeckslab
description: GSEApy Enrichr over-representation analysis
long_description: |
  Galaxy wrapper for GSEApy Enrichr over-representation analysis from a gene
  list. The wrapper can query a named Enrichr library or use an uploaded GMT
  file, standardizes the enrichment result table, and optionally summarizes
  top ranked terms containing a substring.
categories:
  - Statistics
